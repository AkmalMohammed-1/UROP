distibution_train:
  backend: 'nccl'
  init_method: 'env://'
  workers: 8

dataset:
  dataset: cifar10
  nclass: 10
  size: 32
  data_dir: '../dataset'
  load_memory: true
  batch_real: 1024
  nch: 3

# ResNet-18 for evaluation (matches Table 1 of the PPDD paper)
network:
  net_type: resnet
  norm_type: instance
  depth: 18
  width: 1.0

train:
  evaluation_epochs: 2000
  epoch_print_freq: 10
  epoch_eval_interval: 100
  pertrain_epochs: 60
  batch_size: 128
  lr: 0.01
  adamw_lr: 0.001
  eval_optimizer: adamw
  momentum: 0.9
  weight_decay: 5e-4
  seed: 0
  model_num: 20

augmentation:
  mixup: cut
  beta: 1.0
  mix_p: 0.5
  rrc: True
  dsa: true
  dsa_strategy: "color_crop_cutout_flip_scale_rotate"
  aug_type: 'color_crop_cutout'

optimization:
  optimizer: adamw
  lr_scale_adam: 0.1
  lr_img: 0.01
  mom_img: 0.5
  lr_sampling_net: 1e-3

save_path:
  save_dir: "../results/condense"
  pretrain_dir: '../pretrained_models'

condense:
  ipc: 10
  num_premodel: 20
  niter: 20000
  iter_calib: 0
  lambda_mse: 1.0
  lambda_calib: 1.0
  lambda_div: 0.5
  use_wandb: True
  sampling_net: False
  dis_metrics: "PPDD"
  factor: 2
  decode_type: 'single'
  teacher_model_epoch: 20
